[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vela"
version = "0.1.0"
description = "VPP Dispatch Optimization Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.3",
    "highspy>=1.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.24",
    "click>=8.1",
    "rich>=13.7",
    "typer>=0.12",
    "pyarrow>=16.0",
    "boto3>=1.34",
    "cryptography>=42.0",
    "grpcio>=1.63",
    "protobuf>=4.25",
    "anthropic>=0.92",
    "python-multipart>=0.0.9",
    "pymodbus>=3.6",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "faker>=25.0",
]

[project.scripts]
vela = "vela.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that call live external services (e.g. Anthropic API)",
]
