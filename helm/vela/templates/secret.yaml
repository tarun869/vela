# NOTE: In production, use external-secrets or Vault instead of storing secrets
# directly in Helm values. This template is provided for development convenience.
{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vela.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  db-url: {{ .Values.secrets.dbUrl | b64enc | quote }}
  redis-url: {{ .Values.secrets.redisUrl | b64enc | quote }}
  secret-key: {{ .Values.secrets.secretKey | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  grafana-admin-password: {{ .Values.secrets.grafanaAdminPassword | b64enc | quote }}
  smtp-password: {{ .Values.secrets.smtpPassword | default "" | b64enc | quote }}
{{- end }}
