<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
  :root {
    --color-bg: #F0EDE6;
    --color-panel: #FAFAF8;
    --color-card: #FAFAF8;
    --color-accent: #1A7A5E;
    --color-accent-dark: #145540;
    --color-amber: #EF9F27;
    --color-text: #1A1A18;
    --color-text-muted: #5A5A54;
    --color-text-faint: #9A9A90;
    --color-rule: rgba(0,0,0,0.08);
    --font-display: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background-color: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-display);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    line-height: 1.5;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ============ NAV ============ */
  #mainNav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    height: 56px;
    background: rgba(240,237,230,0.93);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    height: 100%;
    gap: 24px;
  }

  .nav-left {
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .nav-logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    color: var(--color-accent);
    letter-spacing: -0.005em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .nav-logo svg { display: block; flex-shrink: 0; }
  .nav-badge {
    margin-left: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    border: 0.5px solid rgba(26,122,94,0.4);
    color: var(--color-accent);
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.06em;
  }

  .nav-center {
    display: flex;
    gap: 2px;
    flex: 1;
    justify-content: center;
  }

  .nav-item {
    font-family: var(--font-mono);
    font-size: 13px;
    color: #5A5A54;
    background: transparent;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 150ms ease, background 150ms ease;
    position: relative;
    letter-spacing: 0.02em;
  }
  .nav-item:hover {
    color: var(--color-text);
    background: rgba(26,122,94,0.06);
  }
  .nav-item.active {
    color: var(--color-text) !important;
  }
  .nav-item.active::after {
    content: '';
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: -2px;
    height: 1.5px;
    background: var(--color-accent);
    border-radius: 1px;
  }


  .nav-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-cta {
    font-family: var(--font-mono);
    font-size: 12px;
    background: #1A1A18;
    color: #F0EDE6;
    border: none;
    padding: 7px 16px;
    border-radius: 4px;
    transition: background 150ms ease;
    letter-spacing: 0.02em;
  }
  .nav-cta:hover { background: #2A2A24; }

  /* ============ DROPDOWN ============ */


  /* ============ APP / PAGES ============ */
  #app { transition: opacity 150ms ease; }
  .page { padding-top: 56px; min-height: 100vh; }
  .page-inner { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
  .page-hero { padding: 80px 0 60px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: rgba(26,122,94,0.6);
    letter-spacing: 0.15em;
    margin-bottom: 16px;
  }
  .page-headline {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(32px, 5vw, 60px);
    color: var(--color-text);
    line-height: 1.0;
    letter-spacing: -0.04em;
  }
  .page-subhead {
    font-family: var(--font-display);
    font-size: 17px;
    color: #5A5A54;
    max-width: 560px;
    margin-top: 20px;
    line-height: 1.6;
  }

  /* ============ HOME (preserved) ============ */
  .container { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
  hr.rule { border: none; border-top: 0.5px solid var(--color-rule); margin: 0; }

  .cta {
    font-family: var(--font-display); font-weight: 500; font-size: 14px;
    padding: 12px 28px; border-radius: 4px; cursor: pointer;
    transition: all 200ms ease; text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    opacity: 0; transform: translateX(-10px);
    border: 0.5px solid transparent;
  }
  .cta-primary {
    background: #1A1A18; color: #F0EDE6;
    border-color: #1A1A18;
  }
  .cta-primary:hover { background: #2A2A24; border-color: #2A2A24; }
  .cta-secondary {
    background: transparent; border-color: rgba(0,0,0,0.2); color: var(--color-text);
  }
  .cta-secondary:hover { border-color: var(--color-accent); color: var(--color-accent); }
  .cta .arrow { transition: transform 200ms ease; }
  .cta:hover .arrow { transform: translateX(3px); }

  .section { padding: 120px 0; position: relative; }
  .section-head {
    margin-bottom: 64px; display: grid;
    grid-template-columns: 1fr 2fr; gap: 64px; align-items: end;
  }
  .section-eyebrow {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--color-accent); letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .section-eyebrow .num { color: var(--color-text-faint); }
  .section-title {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(28px, 3.4vw, 44px); line-height: 1.08;
    letter-spacing: -0.03em; color: var(--color-text);
  }
  .section-subtitle {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--color-text-muted); letter-spacing: 0.06em;
  }

  .stages-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: rgba(26,122,94,0.08);
    border: 0.5px solid rgba(26,122,94,0.08);
  }
  .stage-card {
    background: rgba(26,122,94,0.04);
    border-left: 0.5px solid var(--color-accent);
    padding: 36px 32px 40px; position: relative;
    transition: background 250ms ease, border-color 250ms ease;
    opacity: 0; transform: translateY(30px); overflow: hidden;
  }
  .stage-card:hover {
    background: rgba(26,122,94,0.08); border-left-color: var(--color-amber);
  }
  .stage-num {
    font-family: var(--font-mono); font-size: 48px;
    color: var(--color-accent); opacity: 0.25;
    line-height: 1; margin-bottom: 28px; font-weight: 400;
  }
  .stage-name {
    font-family: var(--font-display); font-weight: 700;
    font-size: 16px; margin-bottom: 12px; letter-spacing: -0.01em;
  }
  .stage-desc {
    font-family: var(--font-display); font-weight: 400; font-size: 14px;
    color: #5A5A54; line-height: 1.55;
  }

  .metrics-card {
    background: var(--color-panel);
    border: 0.5px solid rgba(0,0,0,0.08);
    border-radius: 8px; max-width: 1080px; margin: 0 auto;
    padding: 56px; display: grid; grid-template-columns: 1fr 1fr;
    gap: 56px; position: relative; overflow: hidden;
  }
  .metrics-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
    opacity: 0.4;
  }
  .metrics-tag {
    font-family: var(--font-mono); font-size: 11px; color: var(--color-amber);
    letter-spacing: 0.12em; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .metrics-tag::before {
    content: ""; width: 8px; height: 8px; background: var(--color-amber);
    border-radius: 50%; box-shadow: 0 0 6px rgba(239,159,39,0.3);
  }
  .metrics-headline {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(22px, 2.4vw, 30px); line-height: 1.15;
    letter-spacing: -0.02em; margin-bottom: 20px;
  }
  .metrics-headline .pct {
    color: var(--color-amber); font-style: italic; font-weight: 400;
  }
  .metrics-sub {
    font-family: var(--font-display); font-size: 14px;
    color: #5A5A54; line-height: 1.6; max-width: 380px;
  }

  .compare-table {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr 0.9fr;
    column-gap: 12px; align-self: center;
  }
  .ct-header, .ct-row { display: contents; }
  .ct-header > div {
    font-family: var(--font-mono); font-size: 11px;
    color: #9A9A90; letter-spacing: 0.06em;
    padding: 8px 0; border-bottom: 0.5px solid rgba(0,0,0,0.08);
    text-transform: uppercase;
  }
  .ct-header > div:not(:first-child) { text-align: right; }
  .ct-row > div {
    font-family: var(--font-mono); font-size: 13px; padding: 14px 0;
    border-bottom: 0.5px solid rgba(26,122,94,0.08);
    color: var(--color-text); opacity: 0; transform: translateX(-20px);
  }
  .ct-row > div:not(:first-child) { text-align: right; }
  .ct-row > div:first-child { color: #5A5A54; }
  .ct-row.total > div {
    font-weight: 500; color: var(--color-text);
    border-bottom: none; padding-top: 18px;
  }
  .ct-row .delta { color: var(--color-accent); }
  .ct-row .new-tag {
    color: var(--color-amber); border: 0.5px solid var(--color-amber);
    padding: 2px 8px; border-radius: 2px; font-size: 10px;
    display: inline-block;
  }
  .ct-row .dash { color: #9A9A90; }

  .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .feature-col {
    padding: 0 32px; border-left: 0.5px solid rgba(0,0,0,0.08);
    opacity: 0; transform: scale(0.96);
  }
  .feature-col:first-child { padding-left: 0; border-left: none; }
  .feature-col:last-child { padding-right: 0; }

  .feature-icon {
    width: 48px; height: 48px; margin-bottom: 28px;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .icon-rings, .icon-rings::before, .icon-rings::after {
    border-radius: 50%; border: 0.5px solid var(--color-accent); position: absolute;
  }
  .icon-rings { width: 44px; height: 44px; animation: spin 18s linear infinite; }
  .icon-rings::before {
    content: ""; width: 28px; height: 28px; top: 7px; left: 7px;
    border-color: rgba(26,122,94,0.6); animation: spin 12s linear infinite reverse;
  }
  .icon-rings::after {
    content: ""; width: 14px; height: 14px; top: 14px; left: 14px;
    background: var(--color-accent); border: none;
    box-shadow: 0 0 6px rgba(26,122,94,0.2);
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .icon-bars { display: flex; align-items: flex-end; gap: 4px; width: 44px; height: 44px; }
  .icon-bars span {
    flex: 1; background: var(--color-accent); height: 0;
    transition: height 600ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .icon-lock { width: 28px; height: 36px; position: relative; }
  .icon-lock::before {
    content: ""; position: absolute; top: 0; left: 5px;
    width: 18px; height: 16px; border: 0.5px solid var(--color-accent);
    border-bottom: none; border-radius: 9px 9px 0 0;
  }
  .icon-lock::after {
    content: ""; position: absolute; top: 14px; left: 0;
    width: 28px; height: 22px; border: 0.5px solid var(--color-accent);
    border-radius: 2px;
    background: radial-gradient(circle at 50% 30%, var(--color-accent) 0 2px, transparent 3px);
  }
  .feature-name {
    font-family: var(--font-display); font-weight: 700; font-size: 18px;
    margin-bottom: 14px; letter-spacing: -0.01em;
  }
  .feature-desc {
    font-family: var(--font-display); font-size: 14px;
    color: #5A5A54; line-height: 1.6; margin-bottom: 24px;
  }
  .feature-link {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--color-accent); text-decoration: none;
    letter-spacing: 0.04em; display: inline-flex;
    align-items: center; gap: 8px; transition: gap 200ms ease;
  }
  .feature-link:hover { gap: 14px; }

  .markets-section { text-align: center; }
  .markets-section .section-title { max-width: 700px; margin: 0 auto 18px; }
  .markets-section .section-subtitle { margin-bottom: 56px; }
  .pills {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 12px; margin-bottom: 48px;
  }
  .pill {
    border: 0.5px solid rgba(26,122,94,0.4); color: var(--color-accent);
    font-family: var(--font-mono); font-size: 13px;
    padding: 8px 20px; border-radius: 40px;
    transition: background 200ms ease, border-color 200ms ease;
    cursor: default; letter-spacing: 0.04em; background: transparent;
  }
  .pill:hover { background: rgba(26,122,94,0.08); border-color: var(--color-accent); }
  .markets-note {
    font-family: var(--font-display); font-size: 14px;
    color: #9A9A90; line-height: 1.65;
    max-width: 640px; margin: 0 auto;
  }

  .site-footer {
    border-top: 0.5px solid rgba(0,0,0,0.08);
    padding: 32px 0; margin-top: 40px;
  }
  .footer-inner {
    max-width: 1200px; margin: 0 auto; padding: 0 32px;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    align-items: center; gap: 24px;
  }
  .footer-center {
    text-align: center; font-family: var(--font-mono);
    font-size: 12px; color: var(--color-text-muted);
  }
  .footer-right {
    text-align: right; font-family: var(--font-mono);
    font-size: 12px; color: var(--color-text-faint);
  }

  /* ============ PRODUCT PAGE ============ */
  .feature-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 64px; align-items: center; padding: 72px 0;
  }
  .feature-row.reverse { direction: rtl; }
  .feature-row.reverse > * { direction: ltr; }
  .feature-row > * { opacity: 0; }

  .module-label {
    font-family: var(--font-mono); font-size: 11px;
    color: rgba(26,122,94,0.6); letter-spacing: 0.12em;
    margin-bottom: 18px;
  }
  .module-headline {
    font-family: var(--font-display); font-weight: 700;
    font-size: 28px; color: var(--color-text);
    line-height: 1.15; letter-spacing: -0.015em; margin-bottom: 18px;
  }
  .module-body {
    font-family: var(--font-display); font-size: 15px;
    color: #5A5A54; line-height: 1.7; margin-bottom: 24px;
  }
  .module-bullets { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .module-bullets li {
    font-family: var(--font-mono); font-size: 12px;
    color: #5A5A54; letter-spacing: 0.01em;
    display: flex; gap: 10px; align-items: baseline;
  }
  .module-bullets li::before {
    content: "→"; color: var(--color-accent); font-weight: 700;
  }

  /* Inline mockups (compact panel) */
  .inline-panel {
    background: var(--color-panel);
    border: 0.5px solid rgba(0,0,0,0.08);
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .ip-chrome {
    background: var(--color-bg); height: 32px;
    display: flex; align-items: center; padding: 0 12px;
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    position: relative;
  }
  .ip-dots { display: flex; gap: 6px; }
  .ip-dot { width: 9px; height: 9px; border-radius: 50%; }
  .ip-dot.r { background: #FF5F57; } .ip-dot.y { background: #FEBC2E; } .ip-dot.g { background: #28C840; }
  .ip-url {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-family: var(--font-mono); font-size: 10px;
    color: #9A9A90; background: rgba(255,255,255,0.05);
    padding: 3px 12px; border-radius: 3px; letter-spacing: 0.02em;
  }
  .ip-status {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; border-bottom: 0.5px solid rgba(0,0,0,0.06);
    font-family: var(--font-mono); font-size: 10px;
  }
  .ip-status .l { color: rgba(26,122,94,0.6); letter-spacing: 0.1em; }
  .ip-status .r { color: #9A9A90; display: flex; align-items: center; gap: 6px; }
  .ip-status .pulse {
    width: 6px; height: 6px; border-radius: 50%; background: #28C840;
    animation: pulse 2s ease-in-out infinite;
  }
  .ip-body { padding: 14px; }

  /* Inline bid card */
  .ip-bid {
    background: #F5F2EC; border: 0.5px solid rgba(26,122,94,0.35);
    border-left: 3px solid var(--color-accent); border-radius: 6px;
    overflow: hidden;
  }
  .ip-bid-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 14px; gap: 12px;
  }
  .ip-bid-asset .name {
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    color: var(--color-text); margin-bottom: 3px;
  }
  .ip-bid-asset .market {
    font-family: var(--font-mono); font-size: 10px; color: #9A9A90;
  }
  .ip-bid-meta { text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .ip-risk {
    font-family: var(--font-mono); font-size: 9px; padding: 2px 7px;
    border-radius: 3px; letter-spacing: 0.08em;
    background: rgba(186,117,23,0.15); color: var(--color-amber);
    border: 0.5px solid rgba(239,159,39,0.3);
  }
  .ip-spec {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--color-accent); font-weight: 700;
  }
  .ip-rev {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 14px;
    border-top: 0.5px solid rgba(0,0,0,0.06);
    border-bottom: 0.5px solid rgba(0,0,0,0.06);
  }
  .ip-rev .label { font-family: var(--font-mono); font-size: 9px; color: #9A9A90; letter-spacing: 0.1em; }
  .ip-rev .val { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--color-text); letter-spacing: -0.01em; }
  .ip-rev .val span { font-family: var(--font-mono); font-size: 10px; color: #9A9A90; font-weight: 400; margin-left: 4px; }
  .ip-rationale {
    margin: 12px 14px;
    font-family: var(--font-mono); font-size: 11px;
    color: #5A5A54; line-height: 1.65;
    background: rgba(0,0,0,0.04); padding: 9px 11px; border-radius: 4px;
  }
  .ip-rationale .em { color: var(--color-accent); }
  .ip-rationale .am { color: var(--color-amber); }
  .ip-tags-wrap { padding: 0 14px 12px; }
  .ip-tags-label { font-family: var(--font-mono); font-size: 9px; color: #9A9A90; letter-spacing: 0.1em; margin-bottom: 6px; }
  .ip-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .ip-tag {
    font-family: var(--font-mono); font-size: 9px;
    background: rgba(26,122,94,0.08); border: 0.5px solid rgba(26,122,94,0.25);
    color: rgba(26,122,94,0.8); padding: 2px 7px; border-radius: 3px;
  }
  .ip-actions {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px;
    border-top: 0.5px solid rgba(0,0,0,0.06);
  }
  .ip-actions .meta { font-family: var(--font-mono); font-size: 10px; color: #9A9A90; }
  .ip-actions .btns { display: flex; gap: 6px; }
  .ip-btn {
    font-family: var(--font-mono); font-size: 11px;
    padding: 5px 12px; border-radius: 3px; border: none; cursor: pointer;
    letter-spacing: 0.04em;
  }
  .ip-btn.decline { background: transparent; border: 0.5px solid rgba(0,0,0,0.12); color: #9A9A90; }
  .ip-btn.approve { background: #1A1A18; color: #F0EDE6; font-weight: 700; }

  /* Inline shadow mode */
  .ip-metric-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
  .ip-metric {
    background: rgba(0,0,0,0.04); border: 0.5px solid rgba(26,122,94,0.08);
    border-radius: 5px; padding: 10px 12px;
  }
  .ip-metric .l { font-family: var(--font-mono); font-size: 9px; color: #9A9A90; letter-spacing: 0.1em; }
  .ip-metric .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--color-text); letter-spacing: -0.01em; margin-top: 4px; }
  .ip-metric .v.dim { color: #9A9A90; }
  .ip-metric .v.up { color: var(--color-accent); }
  .ip-metric .s { font-family: var(--font-mono); font-size: 9px; color: #9A9A90; margin-top: 2px; }
  .ip-metric .s.up { color: var(--color-accent); }

  .ip-table { display: flex; flex-direction: column; }
  .ip-tr {
    display: grid; grid-template-columns: 1.4fr 0.8fr 0.8fr 0.7fr;
    gap: 10px; padding: 8px 0;
    border-bottom: 0.5px solid rgba(26,122,94,0.06);
    font-family: var(--font-mono); font-size: 11px;
  }
  .ip-tr.h { font-size: 9px; color: #9A9A90; letter-spacing: 0.08em; padding-bottom: 6px; border-bottom: 0.5px solid rgba(0,0,0,0.08); }
  .ip-tr > div:not(:first-child) { text-align: right; }
  .ip-tr .stream { font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--color-text); }
  .ip-tr .ag { color: var(--color-text); }
  .ip-tr .ba { color: #9A9A90; }
  .ip-tr .dl { color: var(--color-accent); }
  .ip-tr.tot { border-top: 0.5px solid rgba(26,122,94,0.25); border-bottom: none; padding-top: 10px; margin-top: 4px; }
  .ip-tr.tot > div { font-weight: 700; }
  .ip-new {
    color: var(--color-amber); border: 0.5px solid rgba(239,159,39,0.4);
    background: rgba(239,159,39,0.12); padding: 1px 6px; border-radius: 3px;
    font-size: 9px; display: inline-block;
  }

  /* Inline settlement */
  .ip-bar {
    height: 5px; border-radius: 3px; background: rgba(26,122,94,0.08);
    display: flex; overflow: hidden; margin-top: 12px;
  }
  .ip-bar-d { background: var(--color-accent); width: 96.4%; }
  .ip-bar-s { background: rgba(239,159,39,0.5); width: 3.6%; }
  .ip-bar-labels {
    display: flex; justify-content: space-between; margin-top: 6px;
    font-family: var(--font-mono); font-size: 9px;
  }
  .ip-bar-labels .l { color: var(--color-accent); }
  .ip-bar-labels .r { color: var(--color-amber); }
  .ip-asset-row {
    display: grid; grid-template-columns: 1.3fr 0.6fr 0.7fr 0.9fr;
    gap: 8px; padding: 7px 0;
    border-bottom: 0.5px solid rgba(26,122,94,0.06);
    font-family: var(--font-mono); font-size: 10px; align-items: center;
  }
  .ip-asset-row.h { font-size: 9px; color: #9A9A90; letter-spacing: 0.06em; }
  .ip-asset-row > div:not(:first-child) { text-align: right; }
  .ip-asset-row .a-name { font-family: var(--font-display); font-weight: 700; font-size: 11px; color: var(--color-text); }
  .ip-asset-row .a-sub { font-family: var(--font-mono); font-size: 9px; color: #9A9A90; margin-top: 1px; }
  .ip-asset-row.flag { background: rgba(239,159,39,0.04); border-left: 2px solid rgba(239,159,39,0.4); padding-left: 6px; margin-left: -8px; }
  .ip-asset-row .perf-up { color: var(--color-accent); }
  .ip-asset-row .perf-down { color: var(--color-amber); }
  .ip-status-pill {
    font-family: var(--font-mono); font-size: 8px; padding: 2px 6px;
    border-radius: 3px; letter-spacing: 0.05em; display: inline-block;
  }
  .ip-status-pill.ok { background: rgba(26,122,94,0.08); color: var(--color-accent); border: 0.5px solid rgba(26,122,94,0.3); }
  .ip-status-pill.warn { background: rgba(239,159,39,0.12); color: var(--color-amber); border: 0.5px solid rgba(239,159,39,0.3); }

  /* Product CTA block */
  .cta-block {
    text-align: center; padding: 80px 0;
    border-top: 0.5px solid rgba(0,0,0,0.06);
  }
  .cta-block h2 {
    font-family: var(--font-display); font-weight: 700; font-size: 32px;
    color: var(--color-text); margin-bottom: 12px; letter-spacing: -0.02em;
  }
  .cta-block p {
    font-family: var(--font-display); font-size: 16px;
    color: #5A5A54; margin-bottom: 28px;
  }
  .cta-block .cta {
    opacity: 1; transform: none;
  }

  /* ============ SOLUTIONS PAGE ============ */
  .solution-card {
    background: var(--color-panel);
    border: 0.5px solid rgba(0,0,0,0.08);
    border-left: 3px solid var(--color-accent);
    border-radius: 8px; padding: 32px 36px; margin-bottom: 16px;
    opacity: 0; transform: translateY(20px);
  }
  .seg-label {
    font-family: var(--font-mono); font-size: 11px;
    color: rgba(26,122,94,0.6); letter-spacing: 0.12em; margin-bottom: 14px;
  }
  .sol-headline {
    font-family: var(--font-display); font-weight: 700; font-size: 22px;
    color: var(--color-text); letter-spacing: -0.01em; margin-bottom: 14px;
  }
  .sol-body {
    font-family: var(--font-display); font-size: 15px;
    color: #5A5A54; line-height: 1.7; margin-bottom: 8px;
  }
  .pain-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px 24px; margin-top: 24px;
    border-top: 0.5px solid rgba(0,0,0,0.06); padding-top: 20px;
  }
  .pain-grid .ph {
    font-family: var(--font-mono); font-size: 10px;
    color: #9A9A90; letter-spacing: 0.1em;
    padding-bottom: 8px;
  }
  .pain-row {
    font-family: var(--font-mono); font-size: 12px;
    padding: 8px 0; border-top: 0.5px solid rgba(0,0,0,0.05);
    opacity: 0; transform: translateX(-8px);
  }
  .pain-row.pain { color: #9A9A90; }
  .pain-row.pain::before { content: "✗ "; color: rgba(239,159,39,0.6); }
  .pain-row.sol { color: var(--color-text); }
  .pain-row.sol::before { content: "→ "; color: var(--color-accent); }

  .stats-row {
    display: grid; grid-template-columns: repeat(3,1fr);
    gap: 32px; padding: 60px 0; text-align: center;
    border-top: 0.5px solid rgba(0,0,0,0.06); margin-top: 40px;
  }
  .stat-num {
    font-family: var(--font-display); font-weight: 700; font-size: 36px;
    color: var(--color-text); letter-spacing: -0.02em; margin-bottom: 8px;
  }
  .stat-lbl {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--color-text-muted); letter-spacing: 0.08em;
  }

  /* ============ RESOURCES PAGE ============ */
  .resource-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; margin-top: 48px;
  }
  .resource-card {
    background: var(--color-panel);
    border: 0.5px solid rgba(0,0,0,0.08);
    border-radius: 8px; padding: 28px 32px;
    opacity: 0; transform: scale(0.97);
    transition: border-color 200ms ease;
  }
  .resource-card:hover { border-color: rgba(26,122,94,0.35); }
  .res-label {
    font-family: var(--font-mono); font-size: 10px;
    color: rgba(26,122,94,0.6); letter-spacing: 0.12em; margin-bottom: 12px;
  }
  .res-title {
    font-family: var(--font-display); font-weight: 700; font-size: 18px;
    color: var(--color-text); margin-bottom: 12px; letter-spacing: -0.01em;
  }
  .res-body {
    font-family: var(--font-display); font-size: 14px;
    color: #5A5A54; line-height: 1.65; margin-bottom: 18px;
  }
  .res-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .res-tag {
    font-family: var(--font-mono); font-size: 10px;
    background: rgba(26,122,94,0.08);
    border: 0.5px solid rgba(0,0,0,0.08);
    color: rgba(26,122,94,0.7);
    padding: 3px 9px; border-radius: 20px; letter-spacing: 0.02em;
  }
  .res-link {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--color-accent); display: inline-flex;
    align-items: center; gap: 6px; transition: gap 200ms ease;
  }
  .res-link:hover { gap: 12px; }

  .timeline { border-left: 1.5px solid rgba(26,122,94,0.3); padding-left: 18px; margin-top: 4px; }
  .tl-entry { margin-bottom: 16px; position: relative; }
  .tl-entry::before {
    content: ""; position: absolute; left: -24px; top: 5px;
    width: 8px; height: 8px; background: var(--color-accent);
    border-radius: 50%;
  }
  .tl-date {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--color-text-muted); letter-spacing: 0.06em;
  }
  .tl-title {
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    color: var(--color-text); margin: 2px 0 3px;
  }
  .tl-desc {
    font-family: var(--font-mono); font-size: 11px;
    color: #9A9A90; line-height: 1.5;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 1024px) {
    .stages-grid { grid-template-columns: repeat(2, 1fr); }
    .metrics-card { grid-template-columns: 1fr; gap: 40px; padding: 40px; }
    .features-grid { grid-template-columns: 1fr; gap: 0; }
    .feature-col { padding: 32px 0; border-left: none; border-top: 0.5px solid rgba(0,0,0,0.08); }
    .feature-col:first-child { border-top: none; padding-top: 0; }
    .section-head { grid-template-columns: 1fr; gap: 24px; }
  }
  @media (max-width: 768px) {
    .nav-center { display: none; }
    .nav-inner { gap: 12px; }
    .container, .page-inner { padding: 0 20px; }
    .section { padding: 64px 0; }
    .stages-grid { grid-template-columns: 1fr; }
    .footer-inner { grid-template-columns: 1fr; text-align: center; }
    .footer-right, .footer-center { text-align: center; }
    .feature-row, .resource-grid, .pain-grid {
      grid-template-columns: 1fr;
    }
    .feature-row { gap: 32px; padding: 40px 0; }
    .feature-row.reverse { direction: ltr; }
    .stats-row { grid-template-columns: 1fr; gap: 24px; }
    .compare-table { font-size: 11px; }
    .metrics-card { padding: 28px; }
  }

  /* ============ NAV: HOME LIGHT THEME ============ */
  #mainNav.home-active {
    background: rgba(240,237,230,0.93);
    border-bottom: 0.5px solid rgba(26,26,20,0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  #mainNav.home-active .nav-logo { color: #1A7A5E; }
  #mainNav.home-active .nav-logo::before {
    background: #1A7A5E; box-shadow: 0 0 10px rgba(26,122,94,0.45);
  }
  #mainNav.home-active .nav-badge { border-color: rgba(26,122,94,0.35); color: #1A7A5E; }
  #mainNav.home-active .nav-item { color: rgba(26,26,20,0.5); }
  #mainNav.home-active .nav-item:hover { color: #1A1A14; background: rgba(26,122,94,0.07); }
  #mainNav.home-active .nav-item.active { color: #1A1A14 !important; }
  #mainNav.home-active .nav-item.active::after { background: #1A7A5E; }
  #mainNav.home-active .nav-cta { background: #1A1A18; color: #F0EDE6; }
  #mainNav.home-active .nav-cta:hover { background: #2A2A24; }


  /* ============ HERO EDITORIAL (light) ============ */
  .hero-editorial {
    background: #F0EDE6;
    min-height: 100vh;
    padding-top: 56px;
    color: #1A1A14;
    font-family: 'Inter', var(--font-display), sans-serif;
    position: relative;
    overflow: hidden;
  }
  .he-noise {
    position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: 0.025;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.04  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .he-container {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto; padding: 0 32px;
  }

  /* Editorial header */
  .he-header {
    padding: 60px 0 44px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: end;
  }
  .he-eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; color: #1A7A5E; margin-bottom: 20px;
    text-transform: uppercase; display: flex; align-items: center; gap: 10px;
    opacity: 0;
  }
  .he-eyebrow::before { content: ''; width: 20px; height: 0.5px; background: #1A7A5E; }
  .he-headline {
    font-family: 'Inter', sans-serif; font-weight: 800;
    font-size: clamp(38px, 5.2vw, 68px); line-height: 1.02;
    letter-spacing: -0.04em; color: #1A1A14;
    opacity: 0; transform: translateY(22px);
  }
  .he-headline em { font-style: italic; font-weight: 500; color: #1A7A5E; letter-spacing: -0.02em; }
  .he-right { display: flex; flex-direction: column; justify-content: flex-end; }
  .he-sub {
    font-family: 'Inter', sans-serif; font-size: 15px;
    color: rgba(26,26,20,0.52); line-height: 1.72;
    margin-bottom: 28px; max-width: 420px;
    opacity: 0; transform: translateY(14px);
  }
  .he-ctas { display: flex; gap: 12px; flex-wrap: wrap; opacity: 0; }
  .he-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing: 0.04em; padding: 10px 22px; border-radius: 3px;
    cursor: pointer; text-decoration: none; display: inline-flex;
    align-items: center; gap: 8px; transition: all 180ms ease;
    border: 1px solid transparent;
  }
  .he-btn-primary { background: #1A1A18; color: #F0EDE6; border-color: #1A1A18; }
  .he-btn-primary:hover { background: #2A2A24; border-color: #2A2A24; }
  .he-btn-secondary { background: transparent; color: #1A1A14; border-color: rgba(0,0,0,0.2); }
  .he-btn-secondary:hover { border-color: #1A7A5E; color: #1A7A5E; }

  /* Metric strip */
  .he-metrics {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-bottom: 28px;
  }
  .he-metric {
    background: rgba(255,255,255,0.62); border: 0.5px solid rgba(26,26,20,0.09);
    border-radius: 6px; padding: 16px 18px; position: relative; overflow: hidden;
    opacity: 0; transform: translateY(10px);
  }
  .he-metric::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1.5px;
    background: #1A7A5E; transform: scaleX(0); transform-origin: left;
    transition: transform 700ms cubic-bezier(0.16,1,0.3,1);
  }
  .he-metric.loaded::after { transform: scaleX(1); }
  .he-m-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    letter-spacing: 0.14em; color: rgba(26,26,20,0.38); text-transform: uppercase; margin-bottom: 8px;
  }
  .he-m-val {
    font-family: 'Inter', sans-serif; font-weight: 700;
    font-size: 26px; line-height: 1; letter-spacing: -0.03em; color: #1A1A14; margin-bottom: 6px;
  }
  .he-m-val.green { color: #1A7A5E; }
  .he-m-delta {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    display: flex; align-items: center; gap: 5px;
  }
  .he-m-delta.up { color: #1A7A5E; }
  .he-m-delta.dim { color: rgba(26,26,20,0.35); }
  .he-pulse { width: 5px; height: 5px; border-radius: 50%; background: #1A7A5E; flex-shrink: 0; animation: hePulse 1.8s ease-in-out infinite; }
  @keyframes hePulse { 0%,100% { opacity:0.3; transform:scale(1); } 50% { opacity:1; transform:scale(1.5); } }

  /* Dashboard panel */
  .he-dashboard {
    background: rgba(255,255,255,0.5); border: 0.5px solid rgba(26,26,20,0.09);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 28px rgba(26,26,20,0.05), 0 0 0 0.5px rgba(26,26,20,0.04);
    margin-bottom: 80px; opacity: 0; transform: translateY(18px);
  }
  .he-tabs {
    display: flex; border-bottom: 0.5px solid rgba(26,26,20,0.09);
    background: rgba(240,237,230,0.65); overflow-x: auto;
  }
  .he-tab {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    color: rgba(26,26,20,0.42); background: transparent; border: none;
    padding: 13px 22px; cursor: pointer; position: relative;
    transition: color 140ms ease; border-right: 0.5px solid rgba(26,26,20,0.07);
    white-space: nowrap; flex-shrink: 0;
  }
  .he-tab:hover { color: rgba(26,26,20,0.8); }
  .he-tab.active { color: #1A1A14; background: rgba(255,255,255,0.75); }
  .he-tab.active::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 1.5px; background: #1A7A5E;
  }
  .he-panel { display: none; padding: 24px 28px; }
  .he-panel.active { display: block; }

  /* Revenue Stack chart */
  .he-chart-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .he-chart-title { font-family: 'IBM Plex Mono','IBM Plex Mono',monospace; font-size: 11px; color: rgba(26,26,20,0.45); letter-spacing: 0.12em; }
  .he-chart-total { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px; color: #1A7A5E; letter-spacing: -0.03em; }
  .he-chart-wrap { position: relative; height: 240px; }
  .he-marker-line {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: rgba(193,123,46,0.45); pointer-events: none;
  }
  .he-marker-line span {
    position: absolute; top: 4px; left: 3px;
    font-family: 'IBM Plex Mono','IBM Plex Mono',monospace; font-size: 8px;
    color: #C17B2E; letter-spacing: 0.1em; white-space: nowrap;
  }
  .he-chart-legend {
    display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px;
    border-top: 0.5px solid rgba(26,26,20,0.07); padding-top: 14px;
  }
  .he-legend-item {
    display: flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono','IBM Plex Mono',monospace; font-size: 9px;
    color: rgba(26,26,20,0.5); letter-spacing: 0.04em;
  }
  .he-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* Dispatch plan */
  .he-dispatch-table { width: 100%; border-collapse: collapse; }
  .he-dispatch-table thead th {
    font-family: 'IBM Plex Mono','IBM Plex Mono',monospace; font-size: 9px; letter-spacing: 0.12em;
    color: rgba(26,26,20,0.32); text-transform: uppercase; font-weight: 400;
    padding: 0 16px 10px 0; border-bottom: 0.5px solid rgba(26,26,20,0.1); text-align: left;
  }
  .he-dispatch-table tbody tr { border-bottom: 0.5px solid rgba(26,26,20,0.05); transition: background 120ms ease; }
  .he-dispatch-table tbody tr:hover { background: rgba(26,122,94,0.04); }
  .he-dispatch-table tbody td {
    font-family: 'IBM Plex Mono','IBM Plex Mono',monospace; font-size: 11px;
    color: rgba(26,26,20,0.6); padding: 10px 16px 10px 0;
  }
  .he-td-asset { font-family: 'Inter',sans-serif !important; font-size: 12px !important; color: #1A1A14 !important; font-weight: 500; }
  .he-sp {
    font-family: 'IBM Plex Mono','IBM Plex Mono',monospace; font-size: 8px; letter-spacing: 0.07em;
    padding: 2px 7px; border-radius: 3px; display: inline-block; text-transform: uppercase;
  }
  .he-sp.queued { background: rgba(26,26,20,0.05); color: rgba(26,26,20,0.4); border: 0.5px solid rgba(26,26,20,0.1); }
  .he-sp.approved { background: rgba(26,122,94,0.09); color: #1A7A5E; border: 0.5px solid rgba(26,122,94,0.28); }
  .he-sp.dispatched { background: rgba(26,122,94,0.14); color: #1A7A5E; border: 0.5px solid rgba(26,122,94,0.38); font-weight: 500; }
  .he-sp.pending { background: rgba(193,123,46,0.09); color: #C17B2E; border: 0.5px solid rgba(193,123,46,0.28); }

  /* Risk controls */
  .he-risk-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: rgba(26,26,20,0.08); border-radius: 6px; overflow: hidden; }
  .he-risk-col { background: #F8F6F1; }
  .he-risk-col-head {
    font-family: 'IBM Plex Mono','IBM Plex Mono',monospace; font-size: 9px; letter-spacing: 0.16em;
    color: rgba(26,26,20,0.36); text-transform: uppercase;
    padding: 12px 16px 9px; border-bottom: 0.5px solid rgba(26,26,20,0.08);
  }
  .he-risk-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 16px; border-bottom: 0.5px solid rgba(26,26,20,0.05);
  }
  .he-risk-row:last-child { border-bottom: none; }
  .he-risk-k { font-family: 'IBM Plex Mono','IBM Plex Mono',monospace; font-size: 9px; color: rgba(26,26,20,0.45); letter-spacing: 0.04em; }
  .he-risk-v { font-family: 'IBM Plex Mono','IBM Plex Mono',monospace; font-size: 10px; color: #1A1A14; }
  .he-risk-v.ok { color: #1A7A5E; }
  .he-risk-v.warn { color: #C17B2E; }

  function trackInterval(i) { _intervals.push(i); return i; }
  function trackListener(target, event, fn) {
    target.addEventListener(event, fn);
    _listeners.push([target, event, fn]);
  }
  function trackObserver(o) { _observers.push(o); return o; }

  function tearDown() {
    if (_rafId) cancelAnimationFrame(_rafId);
    _rafId = null;
    _intervals.forEach(clearInterval);
    _timeouts.forEach(clearTimeout);
    _listeners.forEach(([t, e, f]) => t.removeEventListener(e, f));
    _observers.forEach((o) => o.disconnect());
    _intervals = []; _timeouts = []; _listeners = []; _observers = [];
    if (_renderer) {
      try { _renderer.dispose(); } catch(e){}
      _renderer = null;
    }
    if (_chart) {

    const datasets = [

      { label:'Freq. Reg.',      data:[10,10,10,8,8,10,12,15,18,20,18,16,14,16,24,35,40,38,30,22,16,12,10,10],        backgroundColor:'#D4B89A', borderRadius:2, borderSkipped:false },

        scales: {
          x: {
            stacked: true,

  function addChartMarkers() {
    if (!_chart) return;
    const wrap = document.querySelector('.he-chart-wrap');
    if (!wrap) return;
    wrap.querySelectorAll('.he-marker-line').forEach((el) => el.remove());
    const ca = _chart.chartArea;
    if (!ca) return;
    const w = ca.right - ca.left;
    [{idx:14, label:'PEAK'}, {idx:17, label:'EVENING'}].forEach(({idx, label}) => {
      const x = ca.left + (idx / 24) * w;
      const line = document.createElement('div');
      line.className = 'he-marker-line';
      line.style.cssText = `left:${x}px;top:${ca.top}px;height:${ca.bottom - ca.top}px`;
      const sp = document.createElement('span');
      sp.textContent = label;
      line.appendChild(sp);
      wrap.appendChild(line);
    });
  }

      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            anime({ targets: entry.target.children, translateY: [24, 0], opacity: [0, 1],
              delay: anime.stagger(120), duration: 700, easing: 'easeOutExpo' });
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      trackObserver(io);
      ['prow1', 'prow2', 'prow3'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) io.observe(el);
      });
    } else if (hash === '#solutions') {

      });
    }, { threshold: 0.15 });
    const stagesGrid = document.querySelector('.stages-grid');
    if (stagesGrid) stagesIO.observe(stagesGrid);
    trackObserver(stagesIO);

    const metricsIO = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          anime({ targets: '.compare-table .ct-row > div', translateX: [-20, 0], opacity: [0, 1],
            duration: 600, delay: anime.stagger(60), easing: 'easeOutQuad' });
          document.querySelectorAll('.delta-val').forEach((el) => {
            const target = parseFloat(el.dataset.target);
            const obj = { v: 0 };
            anime({ targets: obj, v: target, round: 1, duration: 1400, delay: 400, easing: 'easeOutExpo',
              update: () => { el.textContent = '+' + Math.round(obj.v) + '%'; }
            });
          });
          metricsIO.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    const metricsCard = document.querySelector('.metrics-card');
    if (metricsCard) metricsIO.observe(metricsCard);
    trackObserver(metricsIO);

    const featuresIO = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          anime({ targets: '.feature-col', scale: [0.96, 1], opacity: [0, 1],
            duration: 700, delay: anime.stagger(120), easing: 'easeOutExpo' });
          document.querySelectorAll('.icon-bars span').forEach((bar, i) => {
            trackTimeout(setTimeout(() => { bar.style.height = bar.dataset.h + '%'; }, 400 + i * 80));
          });
          featuresIO.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    const featuresGrid = document.querySelector('.features-grid');
    if (featuresGrid) featuresIO.observe(featuresGrid);
    trackObserver(featuresIO);
  }

  // ============ BOOTSTRAP ============
  if (!window.location.hash) {
    window.location.hash = '#home';
  } else {
    handleHashChange();
  }
})();
</script>
</body>
</html>
