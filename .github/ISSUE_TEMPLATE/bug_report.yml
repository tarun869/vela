name: Bug Report
description: Report a bug in the Vela VPP dispatch engine
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the details below so we can reproduce and fix it.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Dispatch Optimizer (MILP)
        - Stochastic / Scenario Planner
        - Asset Model (Battery / Flywheel / CAES / Pumped Hydro)
        - Market Integration (CAISO / ERCOT / PJM)
        - Settlement Calculation
        - Price Spike Detector / Forecasting
        - Telemetry Ingestion
        - API
        - Dashboard
        - Worker / Celery
        - Infrastructure / DevOps
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: "When I run a dispatch optimization for a battery with SOC < 10%, the solver returns an infeasible solution instead of..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce the issue?
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stack Trace
      description: Paste any relevant log output, stack traces, or solver output.
      render: text

  - type: input
    id: version
    attributes:
      label: Vela Version
      description: Run `python -c "import vela; print(vela.__version__)"` or check the API `/version` endpoint.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - development (local)
        - staging
        - production
    validations:
      required: true

  - type: textarea
    id: asset_config
    attributes:
      label: Asset Configuration (if relevant)
      description: Paste the asset config that triggered the issue (redact sensitive values).
      render: yaml

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I can reproduce this issue consistently
          required: false
        - label: This is not a security vulnerability (use security@vela.energy for those)
          required: true
