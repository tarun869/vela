name: CD — Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io/vela-energy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/vela-${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/vela-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: vela-prod-deploy

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-west-2 --name vela-prod

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Deploy to production
        run: |
          helm upgrade --install vela ./helm/vela \
            --namespace vela \
            --create-namespace \
            --values helm/vela/values.yaml \
            --values helm/vela/values-prod.yaml \
            --set image.api.tag=${{ steps.version.outputs.version }} \
            --set image.worker.tag=${{ steps.version.outputs.version }} \
            --set image.dashboard.tag=${{ steps.version.outputs.version }} \
            --set global.imagePullPolicy=Always \
            --atomic \
            --timeout 15m

      - name: Run production smoke tests
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/vela-api -n vela
          API_URL=$(kubectl get ingress -n vela vela-ingress -o jsonpath='{.spec.rules[0].host}')
          curl -sf "https://${API_URL}/healthz" || exit 1
          curl -sf "https://${API_URL}/readyz" || exit 1
          curl -sf "https://${API_URL}/api/v1/assets" -H "Authorization: Bearer ${{ secrets.SMOKE_TEST_TOKEN }}" || exit 1

      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          ref: ${{ github.ref }}

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"🚀 Production deploy successful: v${{ steps.version.outputs.version }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"🚨 Production deploy FAILED: v${{ steps.version.outputs.version }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
