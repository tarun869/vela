apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vela-ingress
  namespace: vela
  labels:
    app.kubernetes.io/name: vela-ingress
    app.kubernetes.io/part-of: vela-vpp
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.vela.energy"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Request-ID"
    # TLS via cert-manager
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
spec:
  tls:
    - hosts:
        - api.vela.energy
        - app.vela.energy
      secretName: vela-tls
  rules:
    - host: api.vela.energy
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vela-api
                port:
                  name: http
    - host: app.vela.energy
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vela-dashboard
                port:
                  number: 80
