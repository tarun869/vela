apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vela
  namespace: vela
  labels:
    app.kubernetes.io/name: vela
    app.kubernetes.io/part-of: vela-vpp
rules:
  # Allow reading ConfigMaps and Secrets (for dynamic config reload)
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, watch, list]
  # Allow reading own pod info
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # Allow reading endpoints (for service discovery)
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list, watch]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, create, update, patch]
