apiVersion: apps/v1
kind: Deployment
metadata:
  name: vela-api
  namespace: vela
  labels:
    app.kubernetes.io/name: vela-api
    app.kubernetes.io/part-of: vela-vpp
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vela-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vela-api
        app.kubernetes.io/name: vela-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vela
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/vela-energy/vela-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: VELA_ENV
              value: production
            - name: VELA_DB_URL
              valueFrom:
                secretKeyRef:
                  name: vela-secrets
                  key: db-url
            - name: VELA_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vela-secrets
                  key: redis-url
            - name: VELA_KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: vela-config
                  key: kafka-brokers
            - name: VELA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vela-secrets
                  key: secret-key
          envFrom:
            - configMapRef:
                name: vela-config
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: vela-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [vela-api]
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: vela-api
