apiVersion: batch/v1
kind: CronJob
metadata:
  name: vela-ml-retrain
  namespace: vela
  labels:
    app.kubernetes.io/name: vela-ml-retrain
    app.kubernetes.io/part-of: vela-vpp
    app.kubernetes.io/component: ml
spec:
  # Retrain every Sunday at 02:00 UTC
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400  # 4 hours
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: vela-ml-retrain-job
        spec:
          serviceAccountName: vela
          restartPolicy: OnFailure
          containers:
            - name: retrain
              image: ghcr.io/vela-energy/vela-worker:latest
              command:
                - python
                - -m
                - vela.m5_forecasting.retrain
              args:
                - "--models=price_spike,load_forecast,ancillary_forecast"
                - "--lookback-days=90"
                - "--validate"
                - "--register"
              env:
                - name: VELA_ENV
                  value: production
                - name: VELA_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: vela-secrets
                      key: db-url
                - name: VELA_MLFLOW_TRACKING_URI
                  valueFrom:
                    configMapKeyRef:
                      name: vela-config
                      key: mlflow-tracking-uri
              envFrom:
                - configMapRef:
                    name: vela-config
              resources:
                requests:
                  cpu: "4"
                  memory: 8Gi
                limits:
                  cpu: "8"
                  memory: 16Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          nodeSelector:
            node-role: ml-training
          tolerations:
            - key: ml-training
              operator: Exists
              effect: NoSchedule
