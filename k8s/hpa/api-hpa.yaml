apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vela-api-hpa
  namespace: vela
  labels:
    app.kubernetes.io/name: vela-api
    app.kubernetes.io/part-of: vela-vpp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vela-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
