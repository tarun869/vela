apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vela-worker-hpa
  namespace: vela
  labels:
    app.kubernetes.io/name: vela-worker
    app.kubernetes.io/part-of: vela-vpp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vela-worker
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: External
      external:
        metric:
          name: celery_queue_length
          selector:
            matchLabels:
              queue: dispatch
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600  # Wait 10m before scaling down workers
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
