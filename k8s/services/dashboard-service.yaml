apiVersion: v1
kind: Service
metadata:
  name: vela-dashboard
  namespace: vela
  labels:
    app.kubernetes.io/name: vela-dashboard
    app.kubernetes.io/part-of: vela-vpp
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  type: LoadBalancer
  selector:
    app: vela-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8501
      protocol: TCP
