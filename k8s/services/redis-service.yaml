apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vela
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: vela-vpp
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: vela
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: vela-vpp
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
