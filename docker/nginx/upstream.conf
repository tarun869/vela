# Upstream definitions for Vela services

upstream vela_api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream vela_dashboard {
    server dashboard:8501 max_fails=3 fail_timeout=30s;
    keepalive 8;
}

upstream vela_grafana {
    server grafana:3000 max_fails=2 fail_timeout=30s;
    keepalive 4;
}

upstream vela_prometheus {
    server prometheus:9090 max_fails=2 fail_timeout=30s;
    keepalive 4;
}
