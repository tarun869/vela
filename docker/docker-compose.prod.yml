# Production compose — resource limits, health checks, restart policies
# Usage: docker compose -f docker-compose.yml -f docker/docker-compose.prod.yml up -d
version: "3.9"

services:
  api:
    image: ${REGISTRY}/vela-api:${IMAGE_TAG:-latest}
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      VELA_ENV: production
      VELA_LOG_LEVEL: INFO
      VELA_DB_URL: ${VELA_DB_URL}
      VELA_REDIS_URL: ${VELA_REDIS_URL}
      VELA_KAFKA_BROKERS: ${VELA_KAFKA_BROKERS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    image: ${REGISTRY}/vela-worker:${IMAGE_TAG:-latest}
    restart: always
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
    environment:
      VELA_ENV: production
      VELA_LOG_LEVEL: INFO
      VELA_DB_URL: ${VELA_DB_URL}
      VELA_REDIS_URL: ${VELA_REDIS_URL}
      VELA_KAFKA_BROKERS: ${VELA_KAFKA_BROKERS}
    healthcheck:
      test: ["CMD", "celery", "-A", "vela.workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  dashboard:
    image: ${REGISTRY}/vela-dashboard:${IMAGE_TAG:-latest}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - api
      - dashboard

  prometheus:
    image: prom/prometheus:v2.50.1
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  grafana:
    image: grafana/grafana:10.3.3
    restart: always
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${VELA_DOMAIN}/grafana
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST}
      GF_SMTP_FROM_ADDRESS: alerts@${VELA_DOMAIN}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  prometheus_data:
  grafana_data:
